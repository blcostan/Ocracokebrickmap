<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ocracoke Commons Brick Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --fig-green: #9CAF88; --dark-green: #557C4B; --sand: #F2EFEA; --brick: #B14A3B; --highlight: #ff3b3b; }
        body { font-family: 'Georgia', serif; background: var(--sand); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        .brick-unit { background: var(--brick); color: white; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 7px; font-weight: bold; border-radius: 2px; padding: 4px; width: 100%; height: 100%; text-transform: uppercase; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.3); }
        .brick-unit.current-focus { outline: 4px solid var(--highlight); background: var(--highlight); transform: scale(1.05); z-index: 99; }
        
        .brick-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .grid-container { display: inline-grid; grid-template-columns: repeat(12, 55px); grid-auto-rows: 42px; gap: 4px; padding: 4px; background: white; border: 4px solid white; }
        
        #search { width: 90%; max-width: 400px; padding: 12px; border-radius: 30px; border: 2px solid var(--fig-green); margin: 10px auto; display: block; }
        #preview-card { width: 90%; max-width: 360px; background: white; border-radius: 12px; padding: 15px; border-left: 5px solid var(--fig-green); margin: 0 auto 20px auto; display: none; text-align: center; }
        .main-map-area { position: relative; width: 100%; max-width: 800px; background: white; padding: 5px; border-radius: 15px; border: 1px solid #ddd; margin: 0 auto 20px auto; }
        .main-map-area img { width: 100%; display: block; border-radius: 10px; }
        #map-dot { position: absolute; width: 30px; height: 30px; background: var(--highlight); border: 3px solid white; border-radius: 50%; display: none; transform: translate(-50%, -50%); z-index: 20; }
        #brick-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--sand); z-index: 1000; display: none; flex-direction: column; overflow: auto; }
    </style>
</head>
<body>

<h1 style="text-align: center; color: var(--dark-green); font-size: 22px; margin: 15px 0 5px 0; font-weight: bold;">Ocracoke Brick Finder</h1>

<input type="text" id="search" placeholder="Enter a name..." disabled>
<div id="preview-card"><div id="preview-text"></div></div>

<div class="main-map-area">
    <div id="map-dot"></div>
    <img src="rendering%20of%20garden.avif" alt="Map">
</div>

<div id="brick-overlay">
    <div style="padding:10px; background:white; text-align:center; position:sticky; top:0; z-index:100;">
        <button onclick="closeBricks()" style="padding:8px 25px; border-radius:20px; border:none; background:var(--dark-green); color:white; font-weight:bold;">← Back to Map</button>
        <div id="section-nav" style="margin-top:10px;"></div>
    </div>
    <div id="brick-container" style="display: flex; justify-content: center; align-items: flex-start; flex: 1; padding: 20px;"></div>
</div>

<script>
    const gardenClient = window.supabase.createClient('https://fcizlimndpfpbkkxardp.supabase.co', 'sb_publishable_6VsgUICkD5_DhMkEEdRlDA_NQkTwj7b');
    const newGardenClient = window.supabase.createClient('https://afkfynvyzglxmbcyqgod.supabase.co', 'sb_publishable_KaakpKOqbhxKXefp8fCTnQ_1OHzhuIu');

    let db1 = [], db2 = [], currentMatches = [], activeSection = "";

    async function loadData() {
        const [res1, res2] = await Promise.all([gardenClient.from('ocracoke_bricks').select('*'), newGardenClient.from('Ocracoke_Bricks_New').select('*')]);
        db1 = res1.data || [];
        db2 = (res2.data || []).map(b => ({ ...b, Inscription: [b.inscription_line_1, b.inscription_line_2, b.inscription_line_3, b.inscription_line_4].filter(l => l && typeof l === 'string' && l.toUpperCase().replace(/\[BLANK\]/gi, "").trim() !== "").map(l => l.toUpperCase().replace(/\[BLANK\]/gi, "").trim()).join(" "), Section: b.section, Row: b.row, Col: b.col, RowSpan: b.row_span, ColSpan: b.col_span, id: b.ID }));
        document.getElementById('search').disabled = false;
    }

    document.getElementById('search').oninput = (e) => {
        const t = e.target.value.toLowerCase().trim();
        if (t.length < 2) { document.getElementById('preview-card').style.display = "none"; return; }
        currentMatches = [...db1.filter(b => (b.Inscription||"").toLowerCase().includes(t)).map(b=>({...b, isNew:false})), ...db2.filter(b => (b.Inscription||"").toLowerCase().includes(t)).map(b=>({...b, isNew:true}))];
        if (currentMatches.length > 0) {
            document.getElementById('preview-text').innerHTML = `<div>Found ${currentMatches.length} bricks.</div><button onclick="viewAll()" style="margin-top:10px; padding:10px; border-radius:20px; border:none; background:var(--dark-green); color:white;">View All Matches</button>`;
            document.getElementById('preview-card').style.display = "block";
        }
    };

    function viewAll() {
        const sections = [...new Set(currentMatches.map(m => m.Section))];
        activeSection = sections[0];
        renderNav(sections);
        renderBricks(activeSection);
    }

    function renderNav(sections) {
        const nav = document.getElementById('section-nav'); nav.innerHTML = "";
        sections.forEach(s => {
            const btn = document.createElement('button'); btn.innerText = s;
            btn.style.margin = "0 5px"; btn.style.padding = "5px 15px"; btn.style.borderRadius = "15px"; btn.style.border = "none";
            btn.onclick = () => { activeSection = s; renderBricks(s); };
            nav.appendChild(btn);
        });
    }

    function renderBricks(section) {
        const container = document.getElementById('brick-container'); container.innerHTML = "";
        const allBricks = [...db1, ...db2];
        const grid = document.createElement('div'); grid.className = 'grid-container';
        
        allBricks.filter(b => b.Section === section).forEach(b => {
            const d = document.createElement('div'); d.className = 'brick-unit';
            d.innerText = (b.Inscription && b.Inscription.toUpperCase() !== "[BLANK]") ? b.Inscription : "";
            if (b.isNew) { d.style.gridRow = `${b.Row} / span ${b.RowSpan}`; d.style.gridColumn = `${b.Col} / span ${b.ColSpan}`; }
            // Highlight if it's in our matches list
            if (currentMatches.find(m => m.id == b.id && m.isNew == !!b.isNew)) d.classList.add('current-focus');
            grid.appendChild(d);
        });
        container.appendChild(grid);
        document.getElementById('brick-overlay').style.display = 'flex';
    }

    function closeBricks() { document.getElementById('brick-overlay').style.display = 'none'; }
    loadData();
</script>
</body>
</html>
