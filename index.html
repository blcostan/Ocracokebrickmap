<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ocracoke Commons Brick Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --fig-green: #9CAF88; 
            --dark-green: #557C4B; 
            --sand: #F2EFEA; 
            --brick: #B14A3B; 
            --highlight: #ff3b3b; 
        }
        
        body { 
            font-family: 'Georgia', serif; 
            background: var(--sand); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
/* DATABASE 1: Larger 1:2 aspect ratio bricks to accommodate multi-line text */
.brick-unit-db1 { 
    background: var(--brick); 
    color: white; 
    text-align: center; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    font-size: 8px; /* Slightly larger, legible text */
    line-height: 1.15;
    font-weight: bold; 
    border-radius: 3px; 
    padding: 4px 6px; /* Generous internal padding */
    width: 100px; /* Scaled up maintaining 1:2 ratio */
    height: 50px; 
    box-sizing: border-box; 
    text-transform: uppercase;
    overflow: hidden; 
    word-break: break-word;
    hyphens: auto;
    flex-shrink: 0;
}
        
        /* DATABASE 2: Fluid dimensions for grid spanning */
        .brick-unit-db2 { 
            background: var(--brick); 
            color: white; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 6px; 
            line-height: 1.1;
            font-weight: bold; 
            border-radius: 2px; 
            padding: 2px; 
            width: 100%; 
            height: 100%; 
            box-sizing: border-box; 
            text-transform: uppercase;
            overflow: hidden; 
            word-break: break-word;
            hyphens: auto;
        }
/* Entrance Left Grid: Fluid row sizing with ratio preservation */
.grid-container.entrance-left {
    grid-template-columns: repeat(20, minmax(0, 1fr)) !important;
    grid-auto-rows: 1fr !important;
    max-width: 1100px !important;
}

        /* Clear, legible text formatted specifically for Entrance Left bricks */
        .grid-container.entrance-left .brick-unit-db2 {
            font-size: clamp(6px, 0.75vw, 8px) !important;
            line-height: 1.15 !important;
            padding: 3px 2px !important;
        }

        /* Scaled font for 2x2 square bricks in Entrance Left */
        .grid-container.entrance-left .brick-unit-db2[style*="span 2"] {
            font-size: clamp(9px, 1.1vw, 12px) !important;
        }
        .current-focus { 
            outline: 3px solid white; 
            background: var(--highlight) !important; 
            transform: scale(1.05); 
            z-index: 99; 
        }
        
        .is-blank { 
            background: #dcd7cc !important; 
            border: 1px dashed #bbb; 
            color: transparent; 
        }

        /* DB1 Layout: Row-based, centered */
        .brick-row { 
            display: flex; 
            justify-content: center; 
            gap: 4px; 
            margin-bottom: 4px; 
        }

        .grid-orientation-header {
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            color: var(--dark-green);
            letter-spacing: 1.5px;
            padding: 12px 0 8px 0;
            text-transform: uppercase;
            width: 100%;
        }
        
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(12, minmax(0, 1fr)); 
            grid-auto-rows: minmax(40px, auto); 
            gap: 4px; 
            padding: 6px; 
            background: white; 
            border: 4px solid white;
            margin: 0 auto;
            width: 100%;
            max-width: 650px; 
            box-sizing: border-box;
        }
        
        #search { 
            width: 90%; 
            max-width: 400px; 
            padding: 12px; 
            border-radius: 30px; 
            border: 2px solid var(--fig-green); 
            margin: 10px auto; 
            display: block; 
        }
        
        #preview-card { 
            width: 90%; 
            max-width: 360px; 
            background: white; 
            border-radius: 12px; 
            padding: 15px; 
            border-left: 5px solid var(--fig-green); 
            margin: 0 auto 20px auto; 
            display: none; 
            text-align: center; 
        }
        
        .main-map-area { 
            position: relative; 
            width: 100%; 
            max-width: 800px; 
            background: white; 
            padding: 5px; 
            border-radius: 15px; 
            border: 1px solid #ddd; 
            margin: 0 auto 20px auto; 
        }
        
        .main-map-area img { 
            width: 100%; 
            display: block; 
            border-radius: 10px; 
        }
        
        #map-dot { 
            position: absolute; 
            width: 30px; 
            height: 30px; 
            background: var(--highlight); 
            border: 3px solid white; 
            border-radius: 50%; 
            display: none; 
            transform: translate(-50%, -50%); 
            z-index: 20; 
        }
        
        #brick-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--sand); 
            z-index: 1000; 
            display: none; 
            flex-direction: column; 
            overflow: auto; 
        }
    </style>
</head>
<body>

<h1 style="text-align: center; color: var(--dark-green); font-size: 22px; margin: 15px 0 5px 0; font-weight: bold;">Ocracoke Brick Finder</h1>
<input type="text" id="search" placeholder="Enter a name..." disabled>
<div id="preview-card"><div id="preview-text"></div></div>

<div class="main-map-area">
    <div id="map-dot"></div>
    <img src="rendering%20of%20garden.avif" alt="Map">
</div>

<div id="brick-overlay">
    <div style="padding:10px; background:white; text-align:center;"><button onclick="closeBricks()" style="padding:8px 25px; border-radius:20px; border:none; background:var(--dark-green); color:white; font-weight:bold;">← Back to Map</button></div>
    <div id="brick-container" style="padding: 20px 0;"></div>
</div>

<script>
    const gardenClient = window.supabase.createClient('https://fcizlimndpfpbkkxardp.supabase.co', 'sb_publishable_6VsgUICkD5_DhMkEEdRlDA_NQkTwj7b');
    const newGardenClient = window.supabase.createClient('https://afkfynvyzglxmbcyqgod.supabase.co', 'sb_publishable_KaakpKOqbhxKXefp8fCTnQ_1OHzhuIu');

    let db1 = [], db2 = [], currentMatches = [], matchIndex = 0;

    async function loadData() {
        const [res1, res2] = await Promise.all([gardenClient.from('ocracoke_bricks').select('*'), newGardenClient.from('ocracoke_bricks_new').select('*')]);
        db1 = (res1.data || []).map(b => ({ ...b, isNew: false, Inscription: b.Inscription || "", Section: b.Section, Row: b.Row, Col: b.Col, id: b.id }));
        db2 = (res2.data || []).map(b => {
            return { 
                ...b, 
                isNew: true,
                Inscription: [b.inscription_line_1, b.inscription_line_2, b.inscription_line_3, b.inscription_line_4]
                    .filter(l => l && typeof l === 'string' && l.toUpperCase() !== "[BLANK]")
                    .join("<br>"),
                Section: b.section, 
                Row: parseInt(b.row), 
                Col: parseInt(b.col), 
                RowSpan: parseInt(b.row_span) || 1, 
                ColSpan: parseInt(b.col_span) || 1, 
                id: b.id || b.ID 
            };
        });
        
        document.getElementById('search').disabled = false;
    }

    document.getElementById('search').oninput = (e) => {
        const t = e.target.value.toLowerCase().trim();
        if (t.length < 2) { document.getElementById('map-dot').style.display = document.getElementById('preview-card').style.display = "none"; return; }
        currentMatches = [
            ...db1.filter(b => (b.Inscription||"").toLowerCase().includes(t)), 
            ...db2.filter(b => (b.Inscription||"").replace(/<br>/g, " ").toLowerCase().includes(t))
        ];
        matchIndex = 0;
        if (currentMatches.length > 0) updateUI();
    };

    function updateUI() {
        const match = currentMatches[matchIndex];
        const dot = document.getElementById('map-dot'); 
        dot.style.display = "block";
        
        // Dynamic map dot placement depending on the section
        if (match.isNew) {
            if (match.Section === "Back NE") {
                dot.style.left = "72%"; 
                dot.style.top = "80%";
            } else {
                dot.style.left = "68%"; 
                dot.style.top = "86%";
            }
        } else {
            // DATABASE 1 (Ocracoke_Bricks)
            dot.style.left = "54%";
            dot.style.top = match.Section.toLowerCase().includes("north") ? "66%" : "41%";
        }
        
        let content = `<div style="font-weight:bold; margin-bottom:10px;">${match.Inscription}</div>`;
        content += `<button onclick="renderTarget(${matchIndex})" style="padding:10px; width:45%; border-radius:20px; border:none; background:var(--dark-green); color:white;">View Map</button>`;
        if (currentMatches.length > 1) content += `<button onclick="matchIndex=(matchIndex+1)%currentMatches.length; updateUI();" style="padding:10px; width:45%; margin-left:5%; border-radius:20px; border:none; background:var(--fig-green); color:white;">Next</button>`;
        document.getElementById('preview-text').innerHTML = content;
        document.getElementById('preview-card').style.display = "block";
    }

    function renderTarget(index) {
        const target = currentMatches[index];
        const container = document.getElementById('brick-container'); container.innerHTML = "";
        
        if (!target.isNew) {
            renderOriginalBricks(target);
        } else {
            renderNewBricks(target);
        }
        document.getElementById('brick-overlay').style.display = 'flex';
    }

// PATH 1: Ocracoke_Bricks (STRICTLY ROW LAYOUT)
function renderOriginalBricks(target) {
    const container = document.getElementById('brick-container');
    container.style.flexDirection = "column";

    const sectionName = (target.Section || "").toLowerCase();
    const isNorth = sectionName.includes("north");
    const isSouth = sectionName.includes("south");

    // 1. TOP HEADERS
    if (isNorth) {
        const topHeader = document.createElement('div');
        topHeader.className = 'grid-orientation-header';
        topHeader.innerHTML = '↑ ↑ ↑ TOWARD LIGHTHOUSE ROAD ↑ ↑ ↑';
        container.appendChild(topHeader);
    } else if (isSouth) {
        const topHeader = document.createElement('div');
        topHeader.className = 'grid-orientation-header';
        topHeader.innerHTML = '↑ ↑ ↑ TOWARD COMMON LAWN ↑ ↑ ↑';
        container.appendChild(topHeader);
    }

    const rows = {}; 
    db1.filter(b => b.Section === target.Section).forEach(b => {
        if(!rows[b.Row]) rows[b.Row] = []; rows[b.Row].push(b);
    });
    
    Object.keys(rows).sort((a,b) => a-b).forEach(r => {
        const rowDiv = document.createElement('div'); rowDiv.className = 'brick-row';
        rows[r].sort((a,b) => a.Col - b.Col).forEach(b => {
            const d = document.createElement('div');
            d.className = (b.Inscription && b.Inscription.toUpperCase() !== "[BLANK]") ? 'brick-unit-db1' : 'brick-unit-db1 is-blank';
            d.innerHTML = (b.Inscription && b.Inscription.toUpperCase() !== "[BLANK]") ? b.Inscription : "";
            
            // TARGET OVERFLOW FIX: Shrink font size if text is too tall
            if (b.Row === 35 && b.Col === 3) {
                d.style.fontSize = "6px";
                d.style.lineHeight = "1.0";
                d.style.padding = "2px 2px";
            }

            if(b.id == target.id) { d.classList.add('current-focus'); setTimeout(() => d.scrollIntoView({ block: 'center' }), 300); }
            rowDiv.appendChild(d);
        });
        container.appendChild(rowDiv);
    });

    // 2. BOTTOM HEADERS
    if (isNorth) {
        const bottomHeader = document.createElement('div');
        bottomHeader.className = 'grid-orientation-header';
        bottomHeader.innerHTML = '↓ ↓ ↓ TOWARD COMMON LAWN ↓ ↓ ↓';
        container.appendChild(bottomHeader);
    } else if (isSouth) {
        const bottomHeader = document.createElement('div');
        bottomHeader.className = 'grid-orientation-header';
        bottomHeader.innerHTML = '↓ ↓ ↓ TOWARD BACK OF GARDEN ↓ ↓ ↓';
        container.appendChild(bottomHeader);
    }
}

function renderNewBricks(target) {
    const container = document.getElementById('brick-container');
    container.style.flexDirection = "column"; 

    // Filter section bricks
    const sectionBricks = db2.filter(b => b.Section === target.Section);
    
    // Calculate row and column boundaries for this section
    const minRow = Math.min(...sectionBricks.map(b => b.Row));
    const maxRow = Math.max(...sectionBricks.map(b => b.Row + b.RowSpan - 1));
    const minCol = Math.min(...sectionBricks.map(b => b.Col));
    const maxCol = Math.max(...sectionBricks.map(b => b.Col + b.ColSpan - 1));

    const totalCols = maxCol - minCol + 1;
    const totalRows = maxRow - minRow + 1;

    const isEntranceLeft = (target.Section || "").toUpperCase() === "ENTRANCE LEFT";

    const wrapper = document.createElement('div');
    wrapper.style.width = "100%";
    wrapper.style.maxWidth = isEntranceLeft ? "1100px" : (maxCol > 12 ? "95%" : "650px"); 
    wrapper.style.margin = "0 auto";
    wrapper.style.boxSizing = "border-box";

    // 1. TOP HEADER
    const topHeader = document.createElement('div');
    topHeader.className = 'grid-orientation-header';
    
    if (isEntranceLeft) {
        topHeader.innerHTML = '↑ ↑ ↑ TOWARD ENTRANCE PATH ↑ ↑ ↑';
    } else {
        topHeader.innerHTML = '↑ ↑ ↑ TOWARD THE ISLAND INN ↑ ↑ ↑';
    }
    wrapper.appendChild(topHeader);

    // 2. GRID CONTAINER
    const grid = document.createElement('div'); 
    grid.className = 'grid-container';
    
    // --- REPLACE YOUR GRID CONTAINER IF/ELSE WITH THIS ---
    if ((target.Section || "").toUpperCase() === "ENTRANCE LEFT") {
        grid.classList.add('entrance-left');
        grid.style.gridTemplateColumns = `repeat(${totalCols}, minmax(0, 1fr))`;
        grid.style.gridAutoRows = "1fr";
        grid.style.aspectRatio = `${totalCols} / ${totalRows}`;
    } else {
        grid.style.gridTemplateColumns = `repeat(${maxCol}, minmax(0, 1fr))`;
    }
    // ----------------------------------------------------
    
    // 3. RENDER BRICKS INVERTED
    sectionBricks.forEach(b => {
        const d = document.createElement('div');
        const hasText = b.Inscription && b.Inscription.trim().length > 0;
        
        d.className = hasText ? 'brick-unit-db2' : 'brick-unit-db2 is-blank';
        d.innerHTML = hasText ? b.Inscription : "";
        
        d.style.gridColumn = `${b.Col} / span ${b.ColSpan}`;
        
        const invertedRow = maxRow - b.Row - b.RowSpan + 2;
        d.style.gridRow = `${invertedRow} / span ${b.RowSpan}`;

        if(b.id == target.id) { 
            d.classList.add('current-focus'); 
            setTimeout(() => d.scrollIntoView({ block: 'center' }), 300); 
        }
        grid.appendChild(d);
    });
    wrapper.appendChild(grid);

    // 4. BOTTOM HEADER
    const bottomHeader = document.createElement('div');
    bottomHeader.className = 'grid-orientation-header';
    
    if (isEntranceLeft) {
        bottomHeader.innerHTML = '↓ ↓ ↓ TOWARD COMMON LAWN ↓ ↓ ↓';
    } else {
        bottomHeader.innerHTML = '↓ ↓ ↓ TOWARD LIGHTHOUSE ROAD ↓ ↓ ↓';
    }
    wrapper.appendChild(bottomHeader);

    container.appendChild(wrapper);
}

    function closeBricks() { document.getElementById('brick-overlay').style.display = 'none'; }
    loadData();
</script>
</body>
</html>
