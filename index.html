<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ocracoke Commons Brick Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --fig-green: #9CAF88; --dark-green: #557C4B; --sand: #F2EFEA; --brick: #B14A3B; --highlight: #ff3b3b; }
        body { font-family: 'Georgia', serif; background: var(--sand); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        .brick-unit { 
            background: var(--brick); color: white; text-align: center; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: 7px; font-weight: bold; border-radius: 2px; padding: 4px; 
            width: 50px; height: 40px; box-sizing: border-box; text-transform: uppercase;
            overflow: hidden; word-break: break-word; line-height: 1;
        }
        .brick-unit.current-focus { outline: 3px solid white; background: var(--highlight); transform: scale(1.05); z-index: 99; }
        .brick-unit.is-blank { background: #dcd7cc; border: 1px dashed #bbb; color: transparent; }

        /* Centering Logic */
        .grid-wrapper { display: flex; justify-content: center; padding: 20px; width: 100%; }
        .brick-grid { display: inline-grid; gap: 4px; }
        
        #search { width: 90%; max-width: 400px; padding: 12px; border-radius: 30px; border: 2px solid var(--fig-green); margin: 10px auto; display: block; }
        #preview-card { width: 90%; max-width: 360px; background: white; border-radius: 12px; padding: 15px; border-left: 5px solid var(--fig-green); margin: 0 auto 20px auto; display: none; text-align: center; }
        .main-map-area { position: relative; width: 100%; max-width: 800px; background: white; padding: 5px; border-radius: 15px; border: 1px solid #ddd; margin: 0 auto 20px auto; }
        .main-map-area img { width: 100%; display: block; border-radius: 10px; }
        #map-dot { position: absolute; width: 30px; height: 30px; background: var(--highlight); border: 3px solid white; border-radius: 50%; display: none; transform: translate(-50%, -50%); z-index: 20; }
        #brick-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--sand); z-index: 1000; display: none; flex-direction: column; overflow: auto; }
    </style>
</head>
<body>

<h1 style="text-align: center; color: var(--dark-green); font-size: 22px; margin: 15px 0 5px 0; font-weight: bold;">Ocracoke Brick Finder</h1>

<input type="text" id="search" placeholder="Enter a name..." disabled>
<div id="preview-card"><div id="preview-text"></div></div>

<div class="main-map-area">
    <div id="map-dot"></div>
    <img src="rendering%20of%20garden.avif" alt="Map">
</div>

<div id="brick-overlay">
    <div style="padding:10px; background:white; text-align:center;"><button onclick="closeBricks()" style="padding:8px 25px; border-radius:20px; border:none; background:var(--dark-green); color:white; font-weight:bold;">← Back to Map</button></div>
    <div id="brick-container"></div>
</div>

<script>
    const gardenClient = window.supabase.createClient('https://fcizlimndpfpbkkxardp.supabase.co', 'sb_publishable_6VsgUICkD5_DhMkEEdRlDA_NQkTwj7b');
    const newGardenClient = window.supabase.createClient('https://afkfynvyzglxmbcyqgod.supabase.co', 'sb_publishable_KaakpKOqbhxKXefp8fCTnQ_1OHzhuIu');

    let db1 = [], db2 = [], currentMatches = [], matchIndex = 0;

    async function loadData() {
        const [res1, res2] = await Promise.all([gardenClient.from('ocracoke_bricks').select('*'), newGardenClient.from('Ocracoke_Bricks_New').select('*')]);
        db1 = (res1.data || []).map(b => ({ ...b, Inscription: b.Inscription || "", Section: b.Section, Row: b.Row, Col: b.Col, RowSpan: 1, ColSpan: 1, id: b.id, isNew: false }));
        db2 = (res2.data || []).map(b => ({ 
            ...b, 
            Inscription: [b.inscription_line_1, b.inscription_line_2, b.inscription_line_3, b.inscription_line_4].filter(l => l && typeof l === 'string' && l.toUpperCase() !== "[BLANK]").join(" "), 
            Section: b.section, Row: b.row, Col: b.col, RowSpan: b.row_span, ColSpan: b.col_span, id: b.ID, isNew: true 
        }));
        document.getElementById('search').disabled = false;
    }

    document.getElementById('search').oninput = (e) => {
        const t = e.target.value.toLowerCase().trim();
        if (t.length < 2) { document.getElementById('map-dot').style.display = document.getElementById('preview-card').style.display = "none"; return; }
        currentMatches = [...db1.filter(b => (b.Inscription||"").toLowerCase().includes(t)), ...db2.filter(b => (b.Inscription||"").toLowerCase().includes(t))];
        matchIndex = 0;
        if (currentMatches.length > 0) updateUI();
    };

    function updateUI() {
        const match = currentMatches[matchIndex];
        const dot = document.getElementById('map-dot');
        dot.style.display = "block";
        dot.style.left = "54%";
        dot.style.top = match.Section.toLowerCase().includes("north") ? "66%" : "41%";
        
        let content = `<div style="font-weight:bold; margin-bottom:10px;">${match.Inscription}</div><div style="font-size:12px; color:#666; margin-bottom:10px;">${matchIndex + 1}/${currentMatches.length}</div>`;
        content += `<button onclick="renderBricks(${matchIndex})" style="padding:10px; width:30%; border-radius:20px; border:none; background:var(--dark-green); color:white;">VIEW MAP</button>`;
        if (currentMatches.length > 1) content += `<button onclick="nextMatch()" style="padding:10px; width:30%; margin-left:2%; border-radius:20px; border:none; background:var(--fig-green); color:white;">NEXT</button>`;
        content += `<button onclick="renderAllMatches()" style="padding:10px; width:30%; margin-left:2%; border-radius:20px; border:none; background:var(--brick); color:white;">VIEW ALL</button>`;
        
        document.getElementById('preview-text').innerHTML = content;
        document.getElementById('preview-card').style.display = "block";
    }

    function nextMatch() { matchIndex = (matchIndex + 1) % currentMatches.length; updateUI(); }

    function renderBricks(index) { renderTarget(currentMatches[index], false); }
    function renderAllMatches() { renderTarget(currentMatches[0], true); }

    function renderTarget(target, highlightAll) {
        const container = document.getElementById('brick-container'); container.innerHTML = "";
        const wrapper = document.createElement('div'); wrapper.className = 'grid-wrapper';
        const grid = document.createElement('div'); grid.className = 'brick-grid';
        grid.style.gridTemplateColumns = "repeat(6, 50px)";
        
        [...db1, ...db2].filter(b => b.Section === target.Section).forEach(b => {
            const d = document.createElement('div'); 
            d.className = (b.Inscription && b.Inscription.toUpperCase() !== "[BLANK]") ? 'brick-unit' : 'brick-unit is-blank';
            d.innerText = (b.Inscription && b.Inscription.toUpperCase() !== "[BLANK]") ? b.Inscription : "";
            d.style.gridRow = `${b.Row} / span ${b.RowSpan}`; 
            d.style.gridColumn = `${b.Col} / span ${b.ColSpan}`;
            
            const isMatch = highlightAll ? currentMatches.some(m => m.id == b.id) : (b.id == target.id);
            if(isMatch) d.classList.add('current-focus');
            
            grid.appendChild(d);
        });
        wrapper.appendChild(grid);
        container.appendChild(wrapper);
        document.getElementById('brick-overlay').style.display = 'flex';
    }

    function closeBricks() { document.getElementById('brick-overlay').style.display = 'none'; }
    loadData();
</script>
</body>
</html>
