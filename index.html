<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ocracoke Commons Brick Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
        :root { 
            --fig-green: #9CAF88; 
            --dark-green: #557C4B; 
            --sand: #F2EFEA; 
            --brick: #B14A3B; 
            --highlight: #ff3b3b; 
        }
        
        body { 
            font-family: 'Georgia', serif; 
            background: var(--sand); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
        /* DATABASE 1: Fixed dimensions with tight text scaling */
        .brick-unit-db1 { 
            background: var(--brick); 
            color: white; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 6px; 
            line-height: 1.1;
            font-weight: bold; 
            border-radius: 2px; 
            padding: 2px; 
            width: 50px; 
            height: 40px; 
            box-sizing: border-box; 
            text-transform: uppercase;
            overflow: hidden; 
            word-break: break-word;
            hyphens: auto;
            flex-shrink: 0;
        }
        
        /* DATABASE 2: Fluid dimensions for grid spanning */
        .brick-unit-db2 { 
            background: var(--brick); 
            color: white; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 6px; 
            line-height: 1.1;
            font-weight: bold; 
            border-radius: 2px; 
            padding: 2px; 
            width: 100%; 
            height: 100%; 
            box-sizing: border-box; 
            text-transform: uppercase;
            overflow: hidden; 
            word-break: break-word;
            hyphens: auto;
        }

        .current-focus { 
            outline: 3px solid white; 
            background: var(--highlight) !important; 
            transform: scale(1.05); 
            z-index: 99; 
        }
        
        .is-blank { 
            background: #dcd7cc !important; 
            border: 1px dashed #bbb; 
            color: transparent; 
        }

        /* DB1 Layout: Row-based, centered */
        .brick-row { 
            display: flex; 
            justify-content: center; 
            gap: 4px; 
            margin-bottom: 4px; 
        }
        
   /* PASTE THIS UPDATED BLOCK */
.grid-container { 
    display: grid; 
    grid-template-columns: repeat(12, minmax(0, 1fr)); 
    grid-auto-rows: minmax(40px, auto); 
    gap: 4px; 
    padding: 6px; 
    background: white; 
    border: 4px solid white;
    margin: 0 auto;
    width: 100%;
    max-width: 650px; 
    box-sizing: border-box;
}
        
        #search { 
            width: 90%; 
            max-width: 400px; 
            padding: 12px; 
            border-radius: 30px; 
            border: 2px solid var(--fig-green); 
            margin: 10px auto; 
            display: block; 
        }
        
        #preview-card { 
            width: 90%; 
            max-width: 360px; 
            background: white; 
            border-radius: 12px; 
            padding: 15px; 
            border-left: 5px solid var(--fig-green); 
            margin: 0 auto 20px auto; 
            display: none; 
            text-align: center; 
        }
        
        .main-map-area { 
            position: relative; 
            width: 100%; 
            max-width: 800px; 
            background: white; 
            padding: 5px; 
            border-radius: 15px; 
            border: 1px solid #ddd; 
            margin: 0 auto 20px auto; 
        }
        
        .main-map-area img { 
            width: 100%; 
            display: block; 
            border-radius: 10px; 
        }
        
        #map-dot { 
            position: absolute; 
            width: 30px; 
            height: 30px; 
            background: var(--highlight); 
            border: 3px solid white; 
            border-radius: 50%; 
            display: none; 
            transform: translate(-50%, -50%); 
            z-index: 20; 
        }
        
        #brick-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: var(--sand); 
            z-index: 1000; 
            display: none; 
            flex-direction: column; 
            overflow: auto; 
        }
    </style>

</head>
<body>

<h1 style="text-align: center; color: var(--dark-green); font-size: 22px; margin: 15px 0 5px 0; font-weight: bold;">Ocracoke Brick Finder</h1>
<input type="text" id="search" placeholder="Enter a name..." disabled>
<div id="preview-card"><div id="preview-text"></div></div>

<div class="main-map-area">
    <div id="map-dot"></div>
    <img src="rendering%20of%20garden.avif" alt="Map">
</div>

<div id="brick-overlay">
    <div style="padding:10px; background:white; text-align:center;"><button onclick="closeBricks()" style="padding:8px 25px; border-radius:20px; border:none; background:var(--dark-green); color:white; font-weight:bold;">← Back to Map</button></div>
    <div id="brick-container" style="padding: 20px 0;"></div>
</div>

<script>
    const gardenClient = window.supabase.createClient('https://fcizlimndpfpbkkxardp.supabase.co', 'sb_publishable_6VsgUICkD5_DhMkEEdRlDA_NQkTwj7b');
    const newGardenClient = window.supabase.createClient('https://afkfynvyzglxmbcyqgod.supabase.co', 'sb_publishable_KaakpKOqbhxKXefp8fCTnQ_1OHzhuIu');

    let db1 = [], db2 = [], currentMatches = [], matchIndex = 0;

    async function loadData() {
        const [res1, res2] = await Promise.all([gardenClient.from('ocracoke_bricks').select('*'), newGardenClient.from('ocracoke_bricks_new').select('*')]);
        db1 = (res1.data || []).map(b => ({ ...b, isNew: false, Inscription: b.Inscription || "", Section: b.Section, Row: b.Row, Col: b.Col, id: b.id }));
db2 = (res2.data || []).map(b => {
    return { 
        ...b, 
        isNew: true,
        Inscription: [b.inscription_line_1, b.inscription_line_2, b.inscription_line_3, b.inscription_line_4]
            .filter(l => l && typeof l === 'string' && l.toUpperCase() !== "[BLANK]")
            .join("<br>"),
        Section: b.section, 
        Row: parseInt(b.row), 
        Col: parseInt(b.col), 
        RowSpan: parseInt(b.row_span) || 1, 
        ColSpan: parseInt(b.col_span) || 1, 
        id: b.id || b.ID 
    };
});
        
        document.getElementById('search').disabled = false;
    }

 document.getElementById('search').oninput = (e) => {
    const t = e.target.value.toLowerCase().trim();
    if (t.length < 2) { document.getElementById('map-dot').style.display = document.getElementById('preview-card').style.display = "none"; return; }
    currentMatches = [
        ...db1.filter(b => (b.Inscription||"").toLowerCase().includes(t)), 
        ...db2.filter(b => (b.Inscription||"").replace(/<br>/g, " ").toLowerCase().includes(t))
    ];
    matchIndex = 0;
    if (currentMatches.length > 0) updateUI();
};

function updateUI() {
        const match = currentMatches[matchIndex];
        const dot = document.getElementById('map-dot'); 
        dot.style.display = "block";
        
        // This checks which database the match belongs to
        if (match.isNew) {
            // DATABASE 2 (ocracoke_bricks_new)
            dot.style.left = "68%"; 
            dot.style.top = "86%";
        } else {
            // DATABASE 1 (Ocracoke_Bricks)
            dot.style.left = "54%";
            dot.style.top = match.Section.toLowerCase().includes("north") ? "66%" : "41%";
        }
        
        let content = `<div style="font-weight:bold; margin-bottom:10px;">${match.Inscription}</div>`;
        content += `<button onclick="renderTarget(${matchIndex})" style="padding:10px; width:45%; border-radius:20px; border:none; background:var(--dark-green); color:white;">View Map</button>`;
        if (currentMatches.length > 1) content += `<button onclick="matchIndex=(matchIndex+1)%currentMatches.length; updateUI();" style="padding:10px; width:45%; margin-left:5%; border-radius:20px; border:none; background:var(--fig-green); color:white;">Next</button>`;
        document.getElementById('preview-text').innerHTML = content;
        document.getElementById('preview-card').style.display = "block";
    }

    function renderTarget(index) {
        const target = currentMatches[index];
        const container = document.getElementById('brick-container'); container.innerHTML = "";
        
        if (!target.isNew) {
            renderOriginalBricks(target);
        } else {
            renderNewBricks(target);
        }
        document.getElementById('brick-overlay').style.display = 'flex';
    }

    // PATH 1: Ocracoke_Bricks (STRICTLY ROW LAYOUT)
    function renderOriginalBricks(target) {
        const container = document.getElementById('brick-container');
        container.style.flexDirection = "column";
        const rows = {}; 
        db1.filter(b => b.Section === target.Section).forEach(b => {
            if(!rows[b.Row]) rows[b.Row] = []; rows[b.Row].push(b);
        });
        Object.keys(rows).sort((a,b) => a-b).forEach(r => {
            const rowDiv = document.createElement('div'); rowDiv.className = 'brick-row';
            rows[r].sort((a,b) => a.Col - b.Col).forEach(b => {
                const d = document.createElement('div');
                d.className = (b.Inscription && b.Inscription.toUpperCase() !== "[BLANK]") ? 'brick-unit-db1' : 'brick-unit-db1 is-blank';
                d.innerHTML = (b.Inscription && b.Inscription.toUpperCase() !== "[BLANK]") ? b.Inscription : "";
                if(b.id == target.id) { d.classList.add('current-focus'); setTimeout(() => d.scrollIntoView({ block: 'center' }), 300); }
                rowDiv.appendChild(d);
            });
            container.appendChild(rowDiv);
        });
    }

function renderNewBricks(target) {
    const container = document.getElementById('brick-container');
    container.style.flexDirection = "column"; // Stack header on top of the grid

    // 1. HEADER (Sits directly above Row 1)
    const header = document.createElement('div');
    header.className = 'grid-orientation-header';
    header.innerHTML = '↑ ↑ ↑ TOWARD LIGHTHOUSE ROAD ↑ ↑ ↑';
    container.appendChild(header);

    // 2. GRID CONTAINER
    const grid = document.createElement('div'); 
    grid.className = 'grid-container';
    
    // 3. RENDER BRICKS AS USUAL
    db2.filter(b => b.Section === target.Section).forEach(b => {
        const d = document.createElement('div');
        const hasText = b.Inscription && b.Inscription.trim().length > 0;
        
        d.className = hasText ? 'brick-unit-db2' : 'brick-unit-db2 is-blank';
        d.innerHTML = hasText ? b.Inscription : "";
        
        d.style.gridColumn = `${b.Col} / span ${b.ColSpan}`;
        d.style.gridRow = `${b.Row} / span ${b.RowSpan}`;

        if(b.id == target.id) { 
            d.classList.add('current-focus'); 
            setTimeout(() => d.scrollIntoView({ block: 'center' }), 300); 
        }
        grid.appendChild(d);
    });
    container.appendChild(grid);
}

    function closeBricks() { document.getElementById('brick-overlay').style.display = 'none'; }
    loadData();
</script>
</body>
</html>
