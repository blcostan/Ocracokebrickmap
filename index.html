<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ocracoke Commons Brick Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --fig-green: #9CAF88; --dark-green: #557C4B; --sand: #F2EFEA; --brick: #B14A3B; --highlight: #ff3b3b; }
        body { font-family: 'Georgia', serif; background: var(--sand); margin: 0; display: flex; flex-direction: column; min-height: 100vh; color: #333; overflow-x: hidden; }
        
        /* Unified Brick Styling */
        .brick-unit { 
            background: var(--brick); color: white; text-align: center; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; font-size: 7px; font-weight: bold; 
            border-radius: 3px; padding: 4px 2px; width: 55px; height: 42px; 
            text-transform: uppercase; box-sizing: border-box;
        }
        
        /* High-Specificity Highlight */
        .brick-unit.current-focus { 
            outline: 3px solid var(--highlight) !important; 
            background: var(--highlight) !important; 
            transform: scale(1.05); 
            z-index: 100;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .brick-unit.is-blank { background: #dcd7cc; border: 1px dashed #bbb; color: transparent; }
        
        /* Layouts */
        .unified-grid-section { display: grid; grid-template-columns: 40px repeat(13, 55px); grid-auto-rows: 42px; gap: 6px; width: max-content; margin: 0 auto; }
        .row-number-label { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--dark-green); font-weight: bold; }
        .brick-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; }
    </style>
</head>
<body>
    <!-- ... (Keep your existing HTML structure here) ... -->
<script>
    // ... (Keep your Supabase setup and loadData function) ...

    function showBrickGrid(target, highlights = []) {
        const container = document.getElementById('brick-container'); container.innerHTML = "";
        
        // Tab navigation logic
        const sections = [...new Set(currentMatches.map(m => m.MappedSec))];
        if (sections.length > 1) {
            const tabs = document.createElement('div'); tabs.style.marginBottom = "20px";
            sections.forEach(s => {
                const b = document.createElement('button'); b.innerText = s; b.style.margin = "0 5px";
                b.style.background = (s === target.MappedSec) ? "var(--dark-green)" : "white";
                b.style.color = (s === target.MappedSec) ? "white" : "var(--dark-green)";
                b.onclick = () => showBrickGrid({MappedSec: s, isV2: target.isV2}, highlights);
                tabs.appendChild(b);
            });
            container.appendChild(tabs);
        }

        const bricks = allBricks.filter(b => b.MappedSec === target.MappedSec);
        
        if (target.isV2) {
            let maxR = Math.max(...bricks.map(b => b.R), 0);
            const grid = document.createElement('div'); grid.className = 'unified-grid-section';
            bricks.forEach(b => {
                const div = document.createElement('div');
                div.className = b.Inscr.includes("[BLANK]") ? 'brick-unit is-blank' : 'brick-unit';
                div.style.gridColumn = `${b.C + 2} / span ${b.ColSpan}`;
                div.style.gridRow = (target.MappedSec !== "Back Fig Garden") ? (maxR - b.R + 1) : b.R;
                
                // Highlight check
                if (highlights.includes(b.id)) { 
                    div.classList.add('current-focus');
                    setTimeout(() => div.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
                }
                
                div.innerHTML = (b.Lines||[]).map(l => `<span style="display:block">${l}</span>`).join("");
                grid.appendChild(div);
            });
            container.appendChild(grid);
        } else {
            // Original layout for non-V2 bricks
            const rows = {}; bricks.forEach(b => { if(!rows[b.R]) rows[b.R] = []; rows[b.R].push(b); });
            Object.keys(rows).sort((a,b)=>a-b).forEach(r => {
                const rowDiv = document.createElement('div'); rowDiv.className = 'brick-row';
                rows[r].sort((a,b)=>a.C-b.C).forEach(b => {
                    const d = document.createElement('div');
                    d.className = b.Inscr.includes("[BLANK]") ? 'brick-unit is-blank' : 'brick-unit';
                    d.innerText = b.Inscr;
                    if (highlights.includes(b.id)) { 
                        d.classList.add('current-focus');
                        setTimeout(() => d.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
                    }
                    rowDiv.appendChild(d);
                });
                container.appendChild(rowDiv);
            });
        }
        document.getElementById('brick-overlay').style.display = 'flex';
    }
    // ... (Rest of your script) ...
</script>
</body>
</html>
