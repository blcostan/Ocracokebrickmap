<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ocracoke Commons Brick Finder</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --fig-green: #9CAF88; --dark-green: #557C4B; --sand: #F2EFEA; 
            --brick: #B14A3B; --highlight: #ff3b3b; 
        }
        body { font-family: 'Georgia', serif; background: var(--sand); margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        /* Brick Styles */
        .brick-unit {
            background: var(--brick); color: white; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 8px; font-weight: bold; border-radius: 2px; padding: 4px;
            width: 70px; height: 40px; box-sizing: border-box; text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .brick-unit.current-focus { outline: 3px solid white; background: var(--highlight); transform: scale(1.2); z-index: 99; }
        .brick-unit.is-blank { background: #dcd7cc; border: 1px dashed #bbb; color: transparent; }

        /* Running Bond Grid: Alternating rows shifted */
        .running-bond-grid {
            display: grid;
            grid-template-columns: repeat(6, 75px);
            gap: 4px;
            justify-content: center;
            padding: 20px;
        }
        /* Offset every other row for the staggered effect */
        .running-bond-grid > div:nth-child(n+7) { grid-column-start: span 1; }
        .running-bond-grid > div:nth-child(even) { margin-left: 37px; } 

        /* New Spanning Grid */
        .grid-container { 
            display: inline-grid; grid-template-columns: repeat(12, 55px); 
            grid-auto-rows: 42px; gap: 4px; padding: 20px;
        }

        #brick-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--sand); z-index: 1000; display: none; flex-direction: column; overflow: auto; }
        .overlay-nav { background: white; padding: 10px; display: flex; justify-content: center; }
        .back-btn { padding: 8px 25px; border-radius: 20px; border: none; background: var(--dark-green); color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="brick-overlay">
        <div class="overlay-nav"><button class="back-btn" onclick="closeBricks()">← Back to Map</button></div>
        <div id="brick-container"></div>
    </div>
    <!-- ... Rest of UI (Search, Map) remains as provided ... -->
    <script>
        // ... (Supabase initialization and data loading remain the same) ...

        function showBrickGrid(targetMatch) {
            const container = document.getElementById('brick-container');
            container.innerHTML = "";
            const sectionBricks = allBricks.filter(b => b.MappedSec === targetMatch.MappedSec);

            if (!targetMatch.isV2) {
                // RUNNING BOND LAYOUT for DB1
                const grid = document.createElement('div');
                grid.className = 'running-bond-grid';
                sectionBricks.sort((a,b) => a.R - b.R || a.C - b.C).forEach(b => {
                    const d = document.createElement('div');
                    d.className = b.Inscr.includes("[BLANK]") ? 'brick-unit is-blank' : 'brick-unit';
                    d.innerText = b.Inscr.includes("[BLANK]") ? "" : b.Inscr;
                    if (b.id === targetMatch.id) { d.classList.add('current-focus'); }
                    grid.appendChild(d);
                });
                container.appendChild(grid);
            } else {
                // SPANNING GRID LAYOUT for DB2
                const grid = document.createElement('div');
                grid.className = 'grid-container';
                sectionBricks.forEach(b => {
                    const d = document.createElement('div');
                    d.className = b.Inscr.includes("[BLANK]") ? 'brick-unit is-blank' : 'brick-unit';
                    d.style.gridRow = `${b.R} / span ${b.RowSpan}`;
                    d.style.gridColumn = `${b.C} / span ${b.ColSpan}`;
                    d.innerText = b.Inscr.includes("[BLANK]") ? "" : b.Inscr;
                    if (b.id === targetMatch.id) { d.classList.add('current-focus'); }
                    grid.appendChild(d);
                });
                container.appendChild(grid);
            }
            document.getElementById('brick-overlay').style.display = 'flex';
        }
        // ... (Remaining helper functions) ...
    </script>
</body>
</html>
