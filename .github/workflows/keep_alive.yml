name: Keep Supabase Alive
on:
  schedule:
    # Runs at 00:00 UTC every 3 days (Supabase pauses after ~7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database 1 (ocracoke_bricks)
        env:
          URL: ${{ secrets.DB1_URL }}
          KEY: ${{ secrets.DB1_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Error: DB1_URL or DB1_KEY secret is missing!"
            exit 1
          fi
          echo "Pinging DB1..."
          curl -s -o /dev/null -w "%{http_code}\n" "${URL}/rest/v1/" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}"

      - name: Ping Database 2 (Ocracoke_Bricks_New)
        env:
          URL: ${{ secrets.DB2_URL }}
          KEY: ${{ secrets.DB2_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Error: DB2_URL or DB2_KEY secret is missing!"
            exit 1
          fi
          echo "Pinging DB2..."
          curl -s -o /dev/null -w "%{http_code}\n" "${URL}/rest/v1/" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}"
